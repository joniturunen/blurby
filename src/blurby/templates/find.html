{% extends 'base_structure.html' %}

{% block title %}Find a secret{% endblock %}

{% block main %}
<article>
  <header>
    <h1>Find a secret</h1>
    <p>Enter the link ID: the 64 characters after <code>/link/</code>.</p>
  </header>
  <form method="POST" action="/find">
    <label for="sha_link">Link ID</label>
    <input type="text" id="sha_link" name="sha_link" autocomplete="off" spellcheck="false">
    <button type="submit">Find the secret</button>
  </form>
</article>
{% endblock %}
