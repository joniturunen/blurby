{% extends 'base_structure.html' %}

{% block main %}
<article>
  <header>
    <h1>Share a secret</h1>
    <p>Blurby stores the secret and gives you a link to it. When the time is up, the secret is deleted.</p>
  </header>
  <form method="POST" action="/">
    <label for="data">Secret</label>
    <textarea name="data" id="data" rows="10" maxlength="16384" required autofocus placeholder="Paste or type the secret"></textarea>
    <label for="ttl_hours">Delete it after</label>
    <select name="ttl_hours" id="ttl_hours">
      {% for hours in ttl_choices %}
      <option value="{{ hours }}"{% if hours == default_ttl %} selected{% endif %}>{{ hours|hours }}</option>
      {% endfor %}
    </select>
    <button type="submit">Generate link</button>
  </form>
</article>
{% endblock %}
