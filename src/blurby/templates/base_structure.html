<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Share a secret{% endblock %} · Blurby</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pico.violet.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/blurby.css') }}">
    <script src="{{ url_for('static', filename='js/blurby.js') }}" defer></script>
  </head>
  <body>
    <header class="container">
      <nav>
        <ul>
          <li><a href="/" class="brand"><strong>🙊 Blurby</strong></a></li>
        </ul>
        <ul>
          <li><a href="/">Create</a></li>
          <li><a href="/find">Find</a></li>
          <li><a href="/about">About</a></li>
          <li><span class="user">🤫 {{ username }}</span></li>
        </ul>
      </nav>
    </header>
    <main class="container">
      {% block main %}{% endblock %}
    </main>
    <footer class="container">
      <small>Blurby keeps a secret only until it expires.</small>
    </footer>
  </body>
</html>
