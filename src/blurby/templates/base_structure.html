<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Share a secret{% endblock %} · Blurby</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pico.orange.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/blurby.css') }}">
    <script src="{{ url_for('static', filename='js/blurby.js') }}" defer></script>
  </head>
  <body>
    <header>
      <nav class="container">
        <ul>
          <li><a href="/" class="brand"><strong>🙊 Blurby</strong></a></li>
        </ul>
        <ul>
          <li><a href="/">Create</a></li>
          <li><a href="/find">Find</a></li>
          <li><a href="/about">About</a></li>
          <li><span class="user">🤫 {{ username }}</span></li>
          <li>
            <button type="button" class="theme-switch" data-theme-switch aria-label="Dark mode" aria-pressed="false" hidden>
              <svg class="moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
              <svg class="sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <main class="container">
      {% block main %}{% endblock %}
    </main>
    <footer class="container">
      <small>Blurby keeps a secret only until it expires.</small>
    </footer>
  </body>
</html>
