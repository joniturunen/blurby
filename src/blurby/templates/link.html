{% extends 'base_structure.html' %}

{% block title %}Secret link{% endblock %}

{% block main %}
<article>
  <header>
    <h1>Your secret's link</h1>
    <p>Send the link to the reader. Anyone with the link can read the secret until {{ expires|when }}.</p>
  </header>
  <label for="sha_link">Link</label>
  <div role="group">
    <input type="text" id="sha_link" value="{{ url }}link/{{ sha_link }}" readonly>
    <button type="button" data-copy="#sha_link" hidden>Copy</button>
  </div>
  <footer>
    <a href="/link/{{ sha_link }}">Open the secret</a>
  </footer>
</article>
{% endblock %}
