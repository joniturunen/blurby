{% extends 'base_structure.html' %}

{% block title %}A secret{% endblock %}

{% block main %}
<article>
  <header>
    <h1>The secret</h1>
  </header>
  <textarea id="secret" rows="10" readonly aria-label="The secret">{{ retrieved_message }}</textarea>
  <button type="button" data-copy="#secret" hidden>Copy the secret</button>
  <table>
    <tbody>
      <tr><th scope="row">Created</th><td>{{ time|when }}</td></tr>
      <tr><th scope="row">Kept until</th><td>{{ ttl|when }}</td></tr>
      <tr><th scope="row">Creator</th><td>{{ creator }}</td></tr>
      <tr><th scope="row">Link ID</th><td><code>{{ sha_link }}</code></td></tr>
    </tbody>
  </table>
  <footer>
    <form method="POST" action="/burn/{{ sha_link }}">
      <button type="submit" class="contrast">🔥 Burn after reading</button>
      <small>Burning deletes the secret for good. Its link then only shows when it was burnt.</small>
    </form>
  </footer>
</article>
{% endblock %}
