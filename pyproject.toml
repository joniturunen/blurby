[project]
name = "blurby"
# The single source of the version: the app reads it from the installed package
# metadata and the Docker publish workflow from this file.
version = "0.5.0"
description = "A small Flask app for sharing short-lived secrets via SHA-256 links."
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.0",
    "waitress",
]

[project.scripts]
blurby = "blurby.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on deprecations and resource leaks instead of letting them pile up.
filterwarnings = ["error"]

[tool.ruff.lint]
# ruff's default rule set: pycodestyle errors (E4, E7, E9) and Pyflakes (F).
# Plus import sorting (I), pyupgrade (UP), bugbear (B), simplifications (SIM)
# and comprehension style (C4).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]

[tool.coverage.run]
source_pkgs = ["blurby"]
branch = true
# `python -m blurby` shim; main() itself is tested.
omit = ["*/blurby/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
fail_under = 95
