[project]
name = "blurby"
# Keep in sync with app/version.py, which the app and Docker workflow read.
version = "0.1.7.6"
description = "A small Flask app for sharing short-lived secrets via SHA-256 links."
# Werkzeug 2.2 uses ast.Str, which was removed in Python 3.14.
requires-python = ">=3.9,<3.14"
# Upper bounds pin the last versions the current code works with:
# Flask-SQLAlchemy 3.x requires an application context for model queries,
# and Flask/Werkzeug 2.3+ are incompatible with Flask-SQLAlchemy 2.x.
dependencies = [
    "bleach",
    "flask>=2.2,<2.3",
    "flask-sqlalchemy>=2.5,<3",
    "sqlalchemy>=1.4,<2",
    "waitress",
    "werkzeug>=2.2,<2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The app modules import each other as top-level modules (`from main import ...`).
pythonpath = ["app"]
testpaths = ["app"]
python_files = ["tests.py"]

[tool.ruff.lint]
# Same blocking checks the flake8 CI gate used: syntax errors, invalid
# comparisons/prints, statement errors and undefined names.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
# The Docker publish workflow `source`s app/version.py, so the file must stay
# valid shell syntax (no spaces around `=`).
exclude = ["app/version.py"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests.py"]
branch = true

[tool.coverage.report]
show_missing = true
