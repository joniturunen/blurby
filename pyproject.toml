[project]
name = "blurby"
# Keep in sync with src/blurby/version.py, which the app and Docker workflow read.
version = "0.1.7.6"
description = "A small Flask app for sharing short-lived secrets via SHA-256 links."
# Werkzeug 2.2 uses ast.Str, which was removed in Python 3.14.
requires-python = ">=3.9,<3.14"
# Upper bounds pin the last versions the current code works with:
# Flask-SQLAlchemy 3.x requires an application context for model queries,
# and Flask/Werkzeug 2.3+ are incompatible with Flask-SQLAlchemy 2.x.
dependencies = [
    "flask>=2.2,<2.3",
    "flask-sqlalchemy>=2.5,<3",
    "sqlalchemy>=1.4,<2",
    "waitress",
    "werkzeug>=2.2,<2.3",
]

[project.scripts]
blurby = "blurby.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Same blocking checks the flake8 CI gate used: syntax errors, invalid
# comparisons/prints, statement errors and undefined names.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
# The Docker publish workflow `source`s src/blurby/version.py, so the file must
# stay valid shell syntax (no spaces around `=`).
exclude = ["src/blurby/version.py"]

[tool.coverage.run]
source_pkgs = ["blurby"]
branch = true

[tool.coverage.report]
show_missing = true
