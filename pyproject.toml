[project]
name = "blurby"
# Keep in sync with src/blurby/version.py, which the app and Docker workflow read.
version = "0.1.7.6"
description = "A small Flask app for sharing short-lived secrets via SHA-256 links."
requires-python = ">=3.9"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.0",
    "waitress",
]

[project.scripts]
blurby = "blurby.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on deprecations and resource leaks instead of letting them pile up.
filterwarnings = ["error"]

[tool.ruff.lint]
# Same blocking checks the flake8 CI gate used: syntax errors, invalid
# comparisons/prints, statement errors and undefined names.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
# The Docker publish workflow `source`s src/blurby/version.py, so the file must
# stay valid shell syntax (no spaces around `=`).
exclude = ["src/blurby/version.py"]

[tool.coverage.run]
source_pkgs = ["blurby"]
branch = true

[tool.coverage.report]
show_missing = true
